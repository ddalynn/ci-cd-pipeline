name: 03 - Prepare Release (Manual)
run-name: "Prepare Release | ${{ inputs.bump_type }} | ${{ inputs.source_sha }} → RC"

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: "Run from a non-main branch. Enter a DEV tag (dev-8e7be55) "
        required: true
        type: string
      bump_type:
        description: "Version bump for RC: major | minor | patch"
        required: false
        default: "patch"
        type: choice
        options: [major, minor, patch]

concurrency:
  group: promote-rc-uat
  cancel-in-progress: false

jobs:
  prepare-rc:
    runs-on: [self-hosted, Linux]
    outputs:
      rc_version: ${{ steps.compute.outputs.rc_version }}
      effective_source_tag: ${{ steps.compute.outputs.effective_source_tag }}
      source_sha: ${{ steps.compute.outputs.source_sha }}
      new_cycle: ${{ steps.cycle.outputs.new_cycle }}
      main_version: ${{ steps.cycle.outputs.main_version }}
      integration_version: ${{ steps.cycle.outputs.integration_version }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    env:
      HARBOR_URL: ${{ vars.HARBOR_URL }}
      DOCKER_USER: ${{ vars.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}

    steps:
      - name: Validate source_sha format
        run: |
          set -euo pipefail
          SOURCE_TAG="${{ inputs.source_sha }}"
          if ! [[ "$SOURCE_TAG" =~ ^(dev-[a-f0-9]{7,}|[0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "::error::Invalid source_sha '$SOURCE_TAG'"
            {
              echo "## Input Validation Failed"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Validate execution branch
        shell: bash
        run: |
          set -euo pipefail

          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            echo "::error::This workflow must not be run from main."
            exit 1
          fi

      - uses: SGitHubActions/create-github-app-token@v1
        id: app-token
        with:
          app-id: ${{ vars.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install python ${{ vars.PYTHON_VERSION }}
        uses: SGitHubActions/setup-python@stable
        with:
          python-version: '${{ vars.PYTHON_VERSION }}'
          index-url: https://${{ vars.JFROG_USERNAME }}:${{ secrets.JFROG_PASSWORD }}@${{ vars.JFROG_URL }}${{ vars.KEAR_ID }}/simple
      - name: Debug Python & Poetry
        run: |
          python --version
          pip --version
          which poetry || true
          poetry --version || true

      - name: Install JF CLI
        uses: SGitHubActions/setup-jfrog-cli@v4
        env:
          JF_URL: ${{ vars.JFROG_BASE_URL }}
          JF_ACCESS_TOKEN: ${{ secrets.JFROG_PASSWORD }}
          JF_USER: ${{ vars.JFROG_USERNAME }}
          JF_PASSWORD: ${{ secrets.JFROG_PASSWORD }}
        with:
          disable-auto-build-publish: true
          download-repository: jfrog-cli-remote

      - name: Configure pip and install Poetry
        run: |
          jf pip-config --repo-resolve ${{ vars.JFROG_REPO_PYPI }}
          pip install --upgrade pip
          pip install poetry    

      - name: Determine release cycle
        id: cycle
        run: |
          set -euo pipefail

          git fetch origin main integration

          MAIN_VERSION=$(git show origin/main:pyproject.toml \
            | grep '^version' \
            | sed -E 's/.*"(.*)"/\1/')

          INTEGRATION_VERSION=$(grep '^version' pyproject.toml \
            | sed -E 's/.*"(.*)"/\1/')

          echo "main_version=$MAIN_VERSION" >> $GITHUB_OUTPUT
          echo "integration_version=$INTEGRATION_VERSION" >> $GITHUB_OUTPUT

          if [ "$MAIN_VERSION" = "$INTEGRATION_VERSION" ]; then
            echo "new_cycle=true" >> $GITHUB_OUTPUT
          else
            echo "new_cycle=false" >> $GITHUB_OUTPUT
          fi

      - name: Bump version for new cycle
        if: steps.cycle.outputs.new_cycle == 'true'
        id: bump
        run: |
          set -euo pipefail

          poetry version "${{ inputs.bump_type }}"

          NEW_VERSION=$(poetry version -s)

          SRC_DIR=$(awk -F= '/src_directory/ {
            gsub(/"/,"",$2)
            gsub(/ /,"",$2)
            print $2
          }' pyproject.toml)

          sed -i -E \
            's/^(__version__ = ")[^"]+(")/\1'"${NEW_VERSION}"'\2/' \
            "${SRC_DIR}/__version__.py"

          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "rc_version=$NEW_VERSION-rc1" >> $GITHUB_OUTPUT

      - name: Commit release version
        if: steps.cycle.outputs.new_cycle == 'true'
        id: commit_version
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_APP_ID: ${{ vars.GH_APP_ID }}
          GIT_REMOTE_URL: ${{ github.server_url }}/${{ github.repository }}.git
        run: |
          git config user.name "${GH_APP_ID}[bot]"
          git config user.email "${GH_APP_ID}+${GH_APP_ID}[bot]@users.noreply.github.com"
          git add pyproject.toml
          SRC_DIR=$(grep 'src_directory' pyproject.toml | sed 's/src_directory = "//;s/"//')
          git add "${SRC_DIR}/__version__.py"
          if ! git diff --staged --quiet; then
            git commit -m "chore: prepare release ${{ steps.bump.outputs.version }} [skip ci]"
            git push "https://x-access-token:${APP_TOKEN}@${GIT_REMOTE_URL#https://}" HEAD:${GITHUB_REF_NAME}          

          fi
          echo "new_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
             
      - name: Resolve new DEV image tag
        if: steps.cycle.outputs.new_cycle == 'true'
        id: new_dev_tag
        run: |
          set -euo pipefail
          NEW_SHA="${{ steps.commit_version.outputs.new_sha }}"
          echo "new_dev_tag=dev-${NEW_SHA}" >> "$GITHUB_OUTPUT"
          echo "New DEV image tag after version bump: dev-${NEW_SHA}"
    
      - name: Read matrix.json
        id: matrix
        run: |
          MATRIX=$(jq -c '.' .github/workflows/matrix.json)
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

      - name: Compute RC version
        id: compute
        run: |
            set -euo pipefail

            NEW_CYCLE="${{ steps.cycle.outputs.new_cycle }}"
            if [ "$NEW_CYCLE" = "true" ]; then
              SOURCE_TAG="${{ steps.new_dev_tag.outputs.new_dev_tag }}"
              echo "New release cycle: using newly built DEV image: ${SOURCE_TAG}"
            else
              SOURCE_TAG="${{ inputs.source_sha }}"
              echo "Ongoing release cycle: using supplied DEV image: ${SOURCE_TAG}"
            fi

            BASE_VERSION=$(grep -E '^\s*version\s*=' pyproject.toml \
              | head -1 \
              | sed -E 's/.*=\s*"([^"]+)".*/\1/')

            if [ -z "$BASE_VERSION" ]; then
              echo "::error::Could not read version from pyproject.toml"
              exit 1
            fi

            TARGET_VERSION="$BASE_VERSION"

            echo "Base version   : $BASE_VERSION"
            echo "Target version : $TARGET_VERSION"
            echo "Source tag     : $SOURCE_TAG"

            if [[ "$SOURCE_TAG" =~ ^dev-([a-f0-9]{7,})$ ]]; then
              SOURCE_SHA="${BASH_REMATCH[1]}"
            else
              echo "::error::Could not determine source SHA from $SOURCE_TAG"
              exit 1
            fi
            echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"

            SRC_REPO=$(jq -r '.[0].tag' .github/workflows/matrix.json)
            DST_REPO=$(jq -r '.[0].uat_tag' .github/workflows/matrix.json)

            ALL_DST_TAGS=$(curl -s \
              -u "${DOCKER_USER}:${DOCKER_PASSWORD}" \
              "https://${HARBOR_URL}/v2/${DST_REPO}/tags/list" \
              | jq -r '.tags[]?' || true)

            RC_NUMBERS=$(echo "$ALL_DST_TAGS" \
              | grep -E "^${TARGET_VERSION}-rc[0-9]+$" \
              | sed -E "s/^${TARGET_VERSION}-rc([0-9]+)$/\1/" \
              | sort -n || true)
            LAST_RC=$(echo "$RC_NUMBERS" | tail -1)

            if [ -z "$LAST_RC" ]; then
              NEXT_RC=1
            else
              NEXT_RC=$((LAST_RC + 1))
            fi

            RC_VERSION="${TARGET_VERSION}-rc${NEXT_RC}"
            echo "rc_version=${RC_VERSION}" >> "$GITHUB_OUTPUT"
            echo "effective_source_tag=${SOURCE_TAG}" >> "$GITHUB_OUTPUT"
            echo "Computed RC version    : ${RC_VERSION}"
            echo "Effective source tag   : ${SOURCE_TAG}"

  build-images:
    needs: prepare-rc
    if: needs.prepare-rc.outputs.new_cycle == 'true'
    uses: ./.github/workflows/cd-all-images-build.yml
    secrets: inherit

  promote-image-tags:
    if: |
      always() &&
      (
        needs.build-images.result == 'success' ||
        needs.build-images.result == 'skipped'
      )
    name: promote ${{ matrix.component.name }}
    needs: [ prepare-rc, build-images]
    runs-on: [self-hosted, Linux]

    strategy:
      fail-fast: true
      matrix:
        component: ${{ fromJSON(needs.prepare-rc.outputs.matrix) }}

    outputs:
      rc_version: ${{ needs.prepare-rc.outputs.rc_version }}

    env:
      HARBOR_URL: ${{ vars.HARBOR_URL }}
      DOCKER_USER: ${{ vars.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}

    steps:
      - name: Login to Harbor
        run: |
          echo "$DOCKER_PASSWORD" | docker login "$HARBOR_URL" -u "$DOCKER_USER" --password-stdin

      - name: Wait for image availability
        if: needs.prepare-rc.outputs.new_cycle == 'true'
        run: |
          set -euo pipefail

          SRC_IMAGE="${HARBOR_URL}/${{ matrix.component.tag }}:${{ needs.prepare-rc.outputs.effective_source_tag }}"
          echo "Waiting for image to become available: $SRC_IMAGE"
          for i in {1..20}; do
            if docker manifest inspect "$SRC_IMAGE" >/dev/null 2>&1; then
              echo "Image is available."
              exit 0
            fi
            echo "Attempt $i/20 - image not ready yet..."
            sleep 15
          done
          echo "::error::Image never became available: $SRC_IMAGE"
          exit 1    
                         
      - name: Retag DEV image as RC in UAT registry
        id: promote-rc
        run: |
          set -euo pipefail

          RC_VERSION="${{ needs.prepare-rc.outputs.rc_version }}"
          EFFECTIVE_SOURCE="${{ needs.prepare-rc.outputs.effective_source_tag }}"

          if [ -z "$RC_VERSION" ]; then
            echo "RC version is empty. Failing promotion."
            exit 1
          fi

            SOURCE_SHA="${{ needs.prepare-rc.outputs.source_sha }}"

          SRC_IMAGE="${HARBOR_URL}/${{ matrix.component.tag }}:${EFFECTIVE_SOURCE}"
          DST_IMAGE="${HARBOR_URL}/${{ matrix.component.uat_tag }}:${RC_VERSION}"
          DST_IMAGE_SHA="${HARBOR_URL}/${{ matrix.component.uat_tag }}:${RC_VERSION}-${SOURCE_SHA}"

          echo "Pulling DEV image: $SRC_IMAGE"
          docker pull "$SRC_IMAGE"

          echo "Tagging as RC (plain): $DST_IMAGE"
          docker tag "$SRC_IMAGE" "$DST_IMAGE"
          docker push "$DST_IMAGE"

          echo "Tagging as RC (with SHA): $DST_IMAGE_SHA"
          docker tag "$SRC_IMAGE" "$DST_IMAGE_SHA"
          docker push "$DST_IMAGE_SHA"

          echo "Successfully promoted ${{ matrix.component.uat_tag }}:${EFFECTIVE_SOURCE} → ${{ matrix.component.uat_tag }}:${RC_VERSION}"

  create-pr-to-main:
    needs:
      - promote-image-tags
    if: success()
    runs-on: [self-hosted, Linux]

    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: integration
          fetch-depth: 0

      - name: Install GitHub CLI
        run: |
          if ! command -v gh &> /dev/null; then
            sudo apt-get update
            sudo apt-get install -y gh
          fi

      - name: Authenticate gh CLI
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "${GITHUB_TOKEN}" | gh auth login --with-token

      - name: Check existing PR (integration → main)
        id: check-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_INFO=$(gh pr list \
            --base main \
            --head integration \
            --state open \
            --json number,author \
            -q '.[0]')

          if [ -z "$PR_INFO" ]; then
            echo "found_pr=false" >> $GITHUB_OUTPUT
            echo "No PR found"
          else
            PR_NUMBER=$(echo "$PR_INFO" | jq -r '.number')
            AUTHOR=$(echo "$PR_INFO" | jq -r '.author.login')

            echo "found_pr=true" >> $GITHUB_OUTPUT
            echo "pr_number=$PR_NUMBER" >> $GITHUB_OUTPUT
            echo "author=$AUTHOR" >> $GITHUB_OUTPUT

            echo "PR found: #$PR_NUMBER by $AUTHOR"
          fi

      - name: Skip automation if existing PR is manual
        if: steps.check-pr.outputs.found_pr == 'true' && !contains(steps.check-pr.outputs.author, 'github-actions')
        run: |
          echo "Manual PR detected (author: ${{ steps.check-pr.outputs.author }}) → skipping automation"

      - name: Update existing pipeline PR
        if: steps.check-pr.outputs.found_pr == 'true' && contains(steps.check-pr.outputs.author, 'github-actions')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e

          PR_NUMBER="${{ steps.check-pr.outputs.pr_number }}"
          RC_VERSION="${{ needs.prepare-rc.outputs.rc_version }}"
          DATE_PARIS=$(TZ="Europe/Paris" date "+%Y-%m-%d %H:%M:%S %Z")

          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"

          TITLE="Promote RC to main (${RC_VERSION})"

          BODY=$(cat <<EOF
          ## Release Candidate Promotion

          **RC Version:** ${RC_VERSION}
          **Triggered by:** ${{ github.actor }}
          **Date (Paris):** ${DATE_PARIS}

          ---

          Please review and update the Release Notes section before merging to production.
          > Release Notes section will be used for the GitHub Release Notes when this PR is merged into main.

          ---
          ## Description
          Briefly describe the changes.

          ### Added
          - _None_

          ### Changed
          - _None_

          ### Deprecated
          - _None_

          ### Removed
          - _None_

          ### Fixed
          - _None_

          ### Security
          - _None_

          ### Promoted RAG
          - **Test set version**: **_To be completed_**
          - **Liferay export data**: **_To be completed_**
          - **MRQ export data**: **_To be completed_**
          - **Decision accuracy**: **_To be completed_**
          - **Retriever accuracy on test set**: **_To be completed_**
          - **Document Accuracy on test set**: **_To be completed_**
          - **Accuracy on test set**: **_To be completed_**
              - **MRQ Accuracy on test set**: **_To be completed_**
              - **Selfcare  Accuracy on test set**: **_To be completed_**
          - **Median RAG response time _on grcode_**: **_To be completed_**
          - **p90 RAG response time _on grcode_**: **_To be completed_**
          - **p95 RAG response time _on grcode_**: **_To be completed_**
          - **Mean RAG response time _on grcode_**: **_To be completed_**
          - **Percentage RAG queries OK _on grcode_**: **_To be completed_**
          ---
          EOF
          )

          echo "Updating PR #${PR_NUMBER} with title: $TITLE"
          gh pr edit "$PR_NUMBER" \
            --title "$TITLE" \
            --body "$BODY"

          echo "PR #${PR_NUMBER} updated successfully."
          {
            echo "## Promotion PR Updated"
            echo ""
            echo "- PR: #${PR_NUMBER}"
            echo "- RC Version: ${RC_VERSION}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create PR if none exists
        if: steps.check-pr.outputs.found_pr == 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e

          git fetch origin main integration --prune

          AHEAD_COUNT=$(git rev-list --count origin/main..origin/integration)

          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"

          RC_VERSION="${{ needs.prepare-rc.outputs.rc_version }}"
          DATE_PARIS=$(TZ="Europe/Paris" date "+%Y-%m-%d %H:%M:%S %Z")

          TITLE="Promote RC to main (${RC_VERSION})"

          BODY=$(cat <<EOF
          ## Release Candidate Promotion

          **RC Version:** ${RC_VERSION}
          **Triggered by:** ${{ github.actor }}
          **Date (Paris):** ${DATE_PARIS}

          ---

          Please review and update the Release Notes section before merging to production.
          > Release Notes section will be used for the GitHub Release Notes when this PR is merged into main.
          
          ---

          ## Description
          Briefly describe the changes.

          ### Added
          - _None_

          ### Changed
          - _None_

          ### Deprecated
          - _None_

          ### Removed
          - _None_

          ### Fixed
          - _None_

          ### Security
          - _None_

          ### Promoted RAG
          - **Test set version**: **_To be completed_**
          - **Liferay export data**: **_To be completed_**
          - **MRQ export data**: **_To be completed_**
          - **Decision accuracy**: **_To be completed_**
          - **Retriever accuracy on test set**: **_To be completed_**
          - **Document Accuracy on test set**: **_To be completed_**
          - **Accuracy on test set**: **_To be completed_**
              - **MRQ Accuracy on test set**: **_To be completed_**
              - **Selfcare  Accuracy on test set**: **_To be completed_**
          - **Median RAG response time _on grcode_**: **_To be completed_**
          - **p90 RAG response time _on grcode_**: **_To be completed_**
          - **p95 RAG response time _on grcode_**: **_To be completed_**
          - **Mean RAG response time _on grcode_**: **_To be completed_**
          - **Percentage RAG queries OK _on grcode_**: **_To be completed_**
          ---
          EOF
          )

                  if [ "$AHEAD_COUNT" -eq 0 ]; then
                    echo "::warning::No commits between main and integration. Skipping PR creation."
                    {
                      echo ""
                      echo "No commits ahead from integration to main."
                      echo "Auto PR was not created (this is expected)."
                    } >> "$GITHUB_STEP_SUMMARY"
                    exit 0
                  fi

                  echo "Creating PR from integration to main..."

                  gh pr create \
                    --base main \
                    --head integration \
                    --title "$TITLE" \
                    --body "$BODY"

      - name: Resolve open PR number
        id: resolve-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER=$(gh pr list \
            --base main \
            --head integration \
            --state open \
            --json number \
            -q '.[0].number // empty')
          echo "pr_number=${PR_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "Open integration → main PR: #${PR_NUMBER}"

  release-summary:
    name: Release Summary
    if: always()
    needs:
      - prepare-rc
      - promote-image-tags
    runs-on: [self-hosted, Linux]
    steps:
    - name: Publish summary
      run: |
        {
          echo "# Release Preparation Summary"
          echo ""

          echo "## Release Cycle"
          echo "- Branch: ${GITHUB_REF_NAME}"
          echo "- New Cycle: ${{ needs.prepare-rc.outputs.new_cycle }}"
          echo ""

          echo "## Versions"
          echo "- Main Version: ${{ needs.prepare-rc.outputs.main_version }}"
          echo "- Integration Version: ${{ needs.prepare-rc.outputs.integration_version }}"
          echo "- RC Version: ${{ needs.prepare-rc.outputs.rc_version }}"
          echo ""

          echo "## Image Promotion"
          echo "- Input DEV Tag: ${{ inputs.source_sha }}"
          echo "- Effective DEV Tag: ${{ needs.prepare-rc.outputs.effective_source_tag }}"
          echo "- Target RC Tag: ${{ needs.prepare-rc.outputs.rc_version }}"
          echo ""

          if [ "${{ needs.prepare-rc.outputs.new_cycle }}" = "true" ]; then
            echo "## Actions Performed"
            echo "- ✅ Version bumped"
            echo "- ✅ New DEV image rebuilt"
            echo "- ✅ DEV image promoted to RC"
          else
            echo "## Actions Performed"
            echo "- ✅ Existing DEV image promoted"
            echo "- ⏭ Version bump skipped"
            echo "- ⏭ Image rebuild skipped"
          fi
        } >> "$GITHUB_STEP_SUMMARY"
