name: 03 - Prepare Release RC (Auto)
run-name: >-
  ${{ format('Prepare Release | {0} → RC', inputs.source_sha) }}

on:
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string

  workflow_dispatch:
    inputs:
      source_sha:
        description: "Run from a non-main branch. Enter a DEV tag: dev-<sha>, dev-<branch>"
        required: true
        type: string
      distinct_id:
        description: "Distinct ID"
        required: false

concurrency:
  group: promote-rc-uat
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare-rc:
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'workflow_call'
    runs-on: [self-hosted, Linux]
    outputs:
      rc_version: ${{ steps.compute.outputs.rc_version }}
      effective_source_tag: ${{ steps.compute.outputs.effective_source_tag }}
      source_sha: ${{ steps.compute.outputs.source_sha }}
      input_source_tag: ${{ steps.source.outputs.source_tag }}
      matrix: ${{ steps.matrix.outputs.matrix }}
      rc_build_sha: ${{ steps.commit_rc_version.outputs.rc_build_sha }}
    env:
      HARBOR_URL: ${{ vars.HARBOR_URL }}
      DOCKER_USER: ${{ vars.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}

    steps:
      - name: Resolve source tag
        id: source
        run: |
          set -euo pipefail

          SOURCE_TAG="${{ inputs.source_sha }}"
          SOURCE_TAG="$(echo -n "$SOURCE_TAG" | xargs)"
          if [ -z "$SOURCE_TAG" ]; then
            echo "::error::source_sha is required for manual trigger."
            exit 1
          fi

          echo "source_tag=$SOURCE_TAG" >> "$GITHUB_OUTPUT"

      - name: Validate input format
        run: |
          set -euo pipefail
          SOURCE_TAG="${{ steps.source.outputs.source_tag }}"
          if ! [[ "$SOURCE_TAG" =~ ^(dev([a-z0-9._-].*)?|[0-9]+\.[0-9]+\.[0-9]+(-dev-[a-z0-9._-]+(-[a-f0-9]{7,})?)?)$ ]]; then
            echo "::error::Invalid source_sha '$SOURCE_TAG'. Expected a DEV tag or x.y.z"
            echo "## Input Validation Failed" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [[ "$SOURCE_TAG" =~ ^dev-([a-f0-9]+)$ ]]; then
            SHA_PART="${BASH_REMATCH[1]}"
            if [[ ${#SHA_PART} -lt 7 ]]; then
              echo "::error::SHA in '$SOURCE_TAG' is only ${#SHA_PART} characters — must be at least 7. Did you copy the full short SHA?"
              echo "## Input Validation Failed" >> "$GITHUB_STEP_SUMMARY"
              echo "SHA \`${SHA_PART}\` is ${#SHA_PART} chars, expected ≥ 7." >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
          fi

      - uses: SGitHubActions/create-github-app-token@v1
        id: app-token
        with:
          app-id: ${{ vars.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: integration
          token: ${{ steps.app-token.outputs.token }}

      - name: Read matrix.json
        id: matrix
        run: |
          MATRIX=$(jq -c '.' .github/workflows/matrix.json)
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

      - name: Compute RC version
        id: compute
        run: |
          set -euo pipefail

          SOURCE_TAG="${{ steps.source.outputs.source_tag }}"
          echo "Source tag: ${SOURCE_TAG}"

          BASE_VERSION=$(grep -E '^\s*version\s*=' pyproject.toml \
            | head -1 \
            | sed -E 's/.*=\s*"([^"]+)".*/\1/')

          if [ -z "$BASE_VERSION" ]; then
            echo "::error::Could not read version from pyproject.toml"
            exit 1
          fi

          TARGET_VERSION="$BASE_VERSION"

          echo "Base version   : $BASE_VERSION"
          echo "Target version : $TARGET_VERSION"
          echo "Source tag     : $SOURCE_TAG"

          if [[ "$SOURCE_TAG" =~ ([a-f0-9]{7,})(-[0-9]{8}-[0-9]{6})?$ ]]; then
            SOURCE_SHA="${BASH_REMATCH[1]}"

          elif [[ "$SOURCE_TAG" =~ ^(dev([a-z0-9._-].*)?|[0-9]+\.[0-9]+\.[0-9]+-dev-[a-z0-9._-]+)$ ]]; then
            SRC_REPO=$(jq -r '.[0].tag' .github/workflows/matrix.json)

            ALL_SRC_TAGS=$(curl -s \
              -u "${DOCKER_USER}:${DOCKER_PASSWORD}" \
              "https://${HARBOR_URL}/v2/${SRC_REPO}/tags/list" \
              | jq -r '.tags[]?' || true)

            # Verify the tag exists, but don't require a SHA
            if ! echo "$ALL_SRC_TAGS" | grep -qx "$SOURCE_TAG"; then
              echo "::error::Source tag '$SOURCE_TAG' does not exist in Harbor."
              exit 1
            fi

            SOURCE_SHA=""

          else
            echo "::error::Could not determine source SHA from $SOURCE_TAG"
            exit 1
          fi

          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          LAST_RC=0
          while IFS= read -r DST_REPO; do
            ALL_DST_TAGS=$(curl -s \
              -u "${DOCKER_USER}:${DOCKER_PASSWORD}" \
              "https://${HARBOR_URL}/v2/${DST_REPO}/tags/list" \
              | jq -r '.tags[]?' || true)
              COMP_MAX=$(echo "$ALL_DST_TAGS" \
                | grep -E "^${TARGET_VERSION}-rc[0-9]+$" || true)

              COMP_MAX=$(echo "$COMP_MAX" \
                | sed -E "s/^${TARGET_VERSION}-rc([0-9]+)$/\1/" \
                | sort -n \
                | tail -1)
            if [ -n "$COMP_MAX" ] && [ "$COMP_MAX" -gt "$LAST_RC" ]; then
              LAST_RC="$COMP_MAX"
            fi
          done < <(jq -r '.[].uat_tag' .github/workflows/matrix.json)

          if [ "$LAST_RC" -eq 0 ]; then
            NEXT_RC=1
          else
            NEXT_RC=$((LAST_RC + 1))
          fi

          RC_VERSION="${TARGET_VERSION}-rc${NEXT_RC}"
          echo "rc_version=${RC_VERSION}" >> "$GITHUB_OUTPUT"
          echo "effective_source_tag=${SOURCE_TAG}" >> "$GITHUB_OUTPUT"
          echo "Computed RC version    : ${RC_VERSION}"
          echo "Effective source tag   : ${SOURCE_TAG}"

      - name: Update and commit RC runtime version
        id: commit_rc_version
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_APP_ID: ${{ vars.GH_APP_ID }}
        run: |
          set -euo pipefail

          SRC_DIR=$(awk -F'=' '/^\s*src_directory\s*=/ {gsub(/^[ \t"]+|[ \t"]+$/,"",$2); gsub(/"/,"",$2); print $2}' pyproject.toml)
          VERSION_FILE="${SRC_DIR}/__version__.py"
          RC_VERSION="${{ steps.compute.outputs.rc_version }}"

          sed -i -E 's/^(__version__\s*=\s*")[^"]*(")/\1'"$RC_VERSION"'\2/' "$VERSION_FILE"

          git config user.name "${GH_APP_ID}[bot]"
          git config user.email "${GH_APP_ID}+${GH_APP_ID}[bot]@users.noreply.github.com"
          git add "$VERSION_FILE"

          if git diff --staged --quiet; then
            echo "RC runtime version already committed: $RC_VERSION"
          else
            git commit -m "chore: prepare RC version ${RC_VERSION} [skip ci]"
            git push "https://x-access-token:${APP_TOKEN}@${GITHUB_SERVER_URL#https://}/${GITHUB_REPOSITORY}.git" HEAD:integration
          fi

          echo "rc_build_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

  promote-image-tags:
    if: needs.prepare-rc.result == 'success'
    name: promote ${{ matrix.component.name }}
    needs: [prepare-rc]
    runs-on: [self-hosted, Linux]

    strategy:
      fail-fast: true
      matrix:
        component: ${{ fromJSON(needs.prepare-rc.outputs.matrix) }}

    outputs:
      rc_version: ${{ needs.prepare-rc.outputs.rc_version }}

    env:
      HARBOR_URL: ${{ vars.HARBOR_URL }}
      DOCKER_USER: ${{ vars.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}

    steps:
      - uses: SGitHubActions/create-github-app-token@v1
        id: app-token
        with:
          app-id: ${{ vars.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}

      - name: Checkout RC commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare-rc.outputs.rc_build_sha }}
          token: ${{ steps.app-token.outputs.token }}

      - name: Install Python ${{ vars.PYTHON_VERSION }}
        uses: SGitHubActions/setup-python@stable
        with:
          python-version: "${{ vars.PYTHON_VERSION }}"
          index-url: https://${{ vars.JFROG_USERNAME }}:${{ secrets.JFROG_PASSWORD }}@${{ vars.JFROG_URL }}${{ vars.KEAR_ID }}/simple

      - name: Setup JFrog CLI
        uses: SGitHubActions/setup-jfrog-cli@v4
        env:
          JF_URL: ${{ vars.JFROG_BASE_URL }}
          JF_USER: ${{ vars.JFROG_USERNAME }}
          JF_PASSWORD: ${{ secrets.JFROG_PASSWORD }}
        with:
          download-repository: jfrog-cli-remote

      - name: Configure JFrog and Poetry
        run: |
          jf pip-config --repo-resolve ${{ vars.JFROG_REPO_PYPI }} --server-id-resolve dsp-jfrog
          pip install poetry | grep -v "Requirement already satisfied"
          poetry source add --priority=primary myjfrog ${{ vars.JFROG_BASE_URL }}/artifactory/api/pypi/${{ vars.JFROG_REPO_PYPI }}/simple
          poetry config http-basic.myjfrog ${{ vars.JFROG_USERNAME }} ${{ secrets.JFROG_PASSWORD }}
          cp /home/runner/.config/pip/pip.conf ./
          chmod 777 ./pip.conf
          cp /home/runner/.config/pypoetry/auth.toml ./
          chmod 777 ./auth.toml

      - name: Build and push RC image
        uses: SGitHubActions/build-push-action@v3
        env:
          JFROG_URL: ${{ vars.JFROG_URL }}${{ vars.KEAR_ID }}
          JFROG_USERNAME: ${{ vars.JFROG_USERNAME }}
          JFROG_PASSWORD: ${{ secrets.JFROG_PASSWORD }}
        with:
          registry: ${{ vars.HARBOR_URL }}
          tags: |
            ${{ matrix.component.uat_tag }}:${{ needs.prepare-rc.outputs.rc_version }}
            ${{ matrix.component.uat_tag }}:${{ needs.prepare-rc.outputs.rc_version }}-${{ needs.prepare-rc.outputs.rc_build_sha }}
          file: ${{ matrix.component.dockerfile }}
          push: true
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          build-options: |
            --no-cache \
            --secret id=jfrog_url,env=JFROG_URL \
            --secret id=jfrog_username,env=JFROG_USERNAME \
            --secret id=jfrog_password,env=JFROG_PASSWORD

  create-pr-to-main:
    needs:
      - prepare-rc
      - promote-image-tags
    if: success()
    runs-on: [self-hosted, Linux]

    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: integration
          fetch-depth: 0

      - name: Install GitHub CLI
        run: |
          if ! command -v gh &> /dev/null; then
            sudo apt-get update
            sudo apt-get install -y gh
          fi

      - name: Authenticate gh CLI
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "${GITHUB_TOKEN}" | gh auth login --with-token

      - name: Check existing PR (integration → main)
        id: check-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_INFO=$(gh pr list \
            --base main \
            --head integration \
            --state open \
            --json number,author \
            -q '.[0]')

          if [ -z "$PR_INFO" ]; then
            echo "found_pr=false" >> $GITHUB_OUTPUT
            echo "No PR found"
          else
            PR_NUMBER=$(echo "$PR_INFO" | jq -r '.number')
            AUTHOR=$(echo "$PR_INFO" | jq -r '.author.login')

            echo "found_pr=true" >> $GITHUB_OUTPUT
            echo "pr_number=$PR_NUMBER" >> $GITHUB_OUTPUT
            echo "author=$AUTHOR" >> $GITHUB_OUTPUT

            echo "PR found: #$PR_NUMBER by $AUTHOR"
          fi

      - name: Skip automation if existing PR is manual
        if: steps.check-pr.outputs.found_pr == 'true' && !contains(steps.check-pr.outputs.author, 'github-actions')
        run: |
          echo "Manual PR detected (author: ${{ steps.check-pr.outputs.author }}) → skipping automation"

      - name: Update existing pipeline PR
        if: steps.check-pr.outputs.found_pr == 'true' && contains(steps.check-pr.outputs.author, 'github-actions')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e

          PR_NUMBER="${{ steps.check-pr.outputs.pr_number }}"
          RC_VERSION="${{ needs.prepare-rc.outputs.rc_version }}"
          DATE_PARIS=$(TZ="Europe/Paris" date "+%Y-%m-%d %H:%M:%S %Z")

          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"

          TITLE="Promote RC to main (${RC_VERSION})"

          BODY=$(cat <<EOF
          ## Release Candidate Promotion

          **RC Version:** ${RC_VERSION}
          **Date (Paris):** ${DATE_PARIS}

          ---

          ⚠️ Please review and update the Release Notes section before merging to production.
          >  Release Notes section will be used for the GitHub Release Notes when this PR is merged into main.

          ---
          ## Description
          Briefly describe the changes.

          ### Added
          - _None_

          ### Changed
          - _None_

          ### Deprecated
          - _None_

          ### Removed
          - _None_

          ### Fixed
          - _None_

          ### Security
          - _None_

          ### Promoted RAG
          - **Test set version**: **_To be completed_**
          - **Liferay export data**: **_To be completed_**
          - **MRQ export data**: **_To be completed_**
          - **Decision accuracy**: **_To be completed_**
          - **Retriever accuracy on test set**: **_To be completed_**
          - **Document Accuracy on test set**: **_To be completed_**
          - **Accuracy on test set**: **_To be completed_**
              - **MRQ Accuracy on test set**: **_To be completed_**
              - **Selfcare  Accuracy on test set**: **_To be completed_**
          - **Median RAG response time _on grcode_**: **_To be completed_**
          - **p90 RAG response time _on grcode_**: **_To be completed_**
          - **p95 RAG response time _on grcode_**: **_To be completed_**
          - **Mean RAG response time _on grcode_**: **_To be completed_**
          - **Percentage RAG queries OK _on grcode_**: **_To be completed_**
          ---
          EOF
          )

          echo "Updating PR #${PR_NUMBER} with title: $TITLE"
          gh pr edit "$PR_NUMBER" \
            --title "$TITLE" \
            --body "$BODY"

          echo "PR #${PR_NUMBER} updated successfully."
          {
            echo "## Promotion PR Updated"
            echo ""
            echo "- PR: #${PR_NUMBER}"
            echo "- RC Version: ${RC_VERSION}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create PR if none exists
        if: steps.check-pr.outputs.found_pr == 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e

          git fetch origin main integration --prune

          AHEAD_COUNT=$(git rev-list --count origin/main..origin/integration)

          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"

          RC_VERSION="${{ needs.prepare-rc.outputs.rc_version }}"
          DATE_PARIS=$(TZ="Europe/Paris" date "+%Y-%m-%d %H:%M:%S %Z")

          TITLE="Promote RC to main (${RC_VERSION})"

          BODY=$(cat <<EOF
          ## Release Candidate Promotion

          **RC Version:** ${RC_VERSION}
          **Date (Paris):** ${DATE_PARIS}

          ---

          ⚠️ Please review and update the Release Notes section before merging to production.
          >  Release Notes section will be used for the GitHub Release Notes when this PR is merged into main.

          ---

          ## Description
          Briefly describe the changes.

          ### Added
          - _None_

          ### Changed
          - _None_

          ### Deprecated
          - _None_

          ### Removed
          - _None_

          ### Fixed
          - _None_

          ### Security
          - _None_

          ### Promoted RAG
          - **Test set version**: **_To be completed_**
          - **Liferay export data**: **_To be completed_**
          - **MRQ export data**: **_To be completed_**
          - **Decision accuracy**: **_To be completed_**
          - **Retriever accuracy on test set**: **_To be completed_**
          - **Document Accuracy on test set**: **_To be completed_**
          - **Accuracy on test set**: **_To be completed_**
              - **MRQ Accuracy on test set**: **_To be completed_**
              - **Selfcare  Accuracy on test set**: **_To be completed_**
          - **Median RAG response time _on grcode_**: **_To be completed_**
          - **p90 RAG response time _on grcode_**: **_To be completed_**
          - **p95 RAG response time _on grcode_**: **_To be completed_**
          - **Mean RAG response time _on grcode_**: **_To be completed_**
          - **Percentage RAG queries OK _on grcode_**: **_To be completed_**
          ---
          EOF
          )

                  if [ "$AHEAD_COUNT" -eq 0 ]; then
                    echo "::warning::No commits between main and integration. Skipping PR creation."
                    {
                      echo ""
                      echo "No commits ahead from integration to main."
                      echo "Auto PR was not created (this is expected)."
                    } >> "$GITHUB_STEP_SUMMARY"
                    exit 0
                  fi

                  echo "Creating PR from integration to main..."

                  gh pr create \
                    --base main \
                    --head integration \
                    --title "$TITLE" \
                    --body "$BODY"

      - name: Resolve open PR number
        id: resolve-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER=$(gh pr list \
            --base main \
            --head integration \
            --state open \
            --json number \
            -q '.[0].number // empty')
          echo "pr_number=${PR_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "Open integration → main PR: #${PR_NUMBER}"

  release-summary:
    name: Release Summary
    if: always()
    needs:
      - prepare-rc
      - promote-image-tags
    runs-on: [self-hosted, Linux]
    steps:
      - name: Publish summary
        run: |
          {
            echo "# Release Preparation Summary"
            echo ""

            echo "## Versions"
            echo "- RC Version: ${{ needs.prepare-rc.outputs.rc_version }}"
            echo ""

            echo "## Image Promotion"
            echo "- Source SHA: ${{ needs.prepare-rc.outputs.source_sha }}"
            echo "- Input DEV Tag: ${{ needs.prepare-rc.outputs.input_source_tag }}"
            echo "- Target RC Tag: ${{ needs.prepare-rc.outputs.rc_version }}"
            echo ""

            echo "## Actions Performed"
            echo "- DEV image promoted to RC"
          } >> "$GITHUB_STEP_SUMMARY"
