name: 04 - Release images to PROD (Manual)
run-name: "Release | ${{ inputs.source_tag }} → PROD"

on:
  workflow_dispatch:
    inputs:
      source_tag:
        description: "Source to promote: dev-<branch>, dev-<sha>, x.y.z-rcN, or x.y.z (re-release)"
        type: string
        required: true

jobs:
  matrix-builder:
    runs-on: [self-hosted, Linux]

    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read matrix.json
        id: set-matrix
        run: |
          MATRIX=$(jq -c '.' .github/workflows/matrix.json)
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

  promote-prod:
    needs: [matrix-builder]
    runs-on: [self-hosted, Linux]

    strategy:
      fail-fast: true
      matrix:
        component: ${{ fromJSON(needs.matrix-builder.outputs.matrix) }}

    env:
      HARBOR_URL: ${{ vars.HARBOR_URL }}
      DOCKER_USER: ${{ vars.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Login Harbor
        run: |
          echo "$DOCKER_PASSWORD" | docker login "$HARBOR_URL" \
            -u "$DOCKER_USER" \
            --password-stdin

      - name: Resolve input
        id: input
        run: |
          set -euo pipefail
          DEV_REGEX='^dev([a-z0-9._-].*)?$'
          RC_REGEX='^[0-9]+\.[0-9]+\.[0-9]+-rc[0-9]+$'
          RELEASE_REGEX='^[0-9]+\.[0-9]+\.[0-9]+$'
          INPUT="$(echo -n "${{ inputs.source_tag }}" | xargs)"

          if [[ "$INPUT" =~ $DEV_REGEX ]]; then
            TYPE="dev"
            BASE_VERSION=$(grep -E '^\s*version\s*=' pyproject.toml \
              | head -1 \
              | sed -E 's/.*=\s*"([^"]+)".*/\1/')
            if [ -z "$BASE_VERSION" ]; then
              echo "::error::Could not read version from pyproject.toml"
              exit 1
            fi
            RELEASE_TAG="$BASE_VERSION"
            echo "DEV source detected: $INPUT (release $RELEASE_TAG)"
          elif [[ "$INPUT" =~ $RC_REGEX ]]; then
            TYPE="rc"
            RELEASE_TAG="${INPUT%%-rc*}"
            echo "RC source detected: $INPUT (release $RELEASE_TAG)"
          elif [[ "$INPUT" =~ $RELEASE_REGEX ]]; then
            TYPE="release"
            RELEASE_TAG="$INPUT"
            echo "Release source detected: $INPUT"
          else
            echo "::error::Invalid source_tag '$INPUT'. Expected dev-<branch>, dev-<sha>, x.y.z-rcN, or x.y.z"
            exit 1
          fi

          echo "type=$TYPE" >> "$GITHUB_OUTPUT"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "input=$INPUT" >> "$GITHUB_OUTPUT"

      - name: Resolve source image
        id: source
        run: |
          set -euo pipefail
          TYPE="${{ steps.input.outputs.type }}"
          INPUT="${{ steps.input.outputs.input }}"
          RELEASE_TAG="${{ steps.input.outputs.release_tag }}"

          case "$TYPE" in
            dev)
              SOURCE_REPO="${{ matrix.component.tag }}"
              DEV_SHA_REGEX='^dev-[a-f0-9]{7,}$'
              TAGS=$(curl -s \
                -u "${DOCKER_USER}:${DOCKER_PASSWORD}" \
                "https://${HARBOR_URL}/v2/${SOURCE_REPO}/tags/list" \
                | jq -r '.tags[]?' || true)

              if [[ "$INPUT" =~ $DEV_SHA_REGEX ]]; then
                SOURCE_TAG="$INPUT"
              else
                SOURCE_TAG=$(echo "$TAGS" \
                  | awk -v t="$INPUT" '
                      index($0, t "-") == 1 {
                        rest = substr($0, length(t) + 2)
                        if (rest ~ /^[a-f0-9]{7,}-[0-9]{8}-[0-9]{6}$/) {
                          print $0 "|2"
                        } else if (rest ~ /^[a-f0-9]{7,}$/) {
                          print $0 "|1"
                        }
                      }' \
                  | sort -t'|' -k2,2nr \
                  | head -1 \
                  | cut -d'|' -f1)
              fi

              if [ -z "$SOURCE_TAG" ] || ! echo "$TAGS" | grep -Fxq "$SOURCE_TAG"; then
                echo "::error::No DEV image found in Harbor for '$INPUT'"
                exit 1
              fi
              echo "Resolved DEV tag: $SOURCE_TAG"
              ;;

            rc)
              SOURCE_REPO="${{ matrix.component.uat_tag }}"
              TAGS=$(curl -s \
                -u "${DOCKER_USER}:${DOCKER_PASSWORD}" \
                "https://${HARBOR_URL}/v2/${SOURCE_REPO}/tags/list" \
                | jq -r '.tags[]?' || true)

              if ! echo "$TAGS" | grep -Fxq "$INPUT"; then
                echo "::error::No RC tag found in Harbor matching '$INPUT'"
                exit 1
              fi
              SOURCE_TAG="$INPUT"
              echo "Resolved RC tag: $SOURCE_TAG"
              ;;

            release)
              SOURCE_REPO="${{ matrix.component.tag }}"
              TAGS=$(curl -s \
                -u "${DOCKER_USER}:${DOCKER_PASSWORD}" \
                "https://${HARBOR_URL}/v2/${SOURCE_REPO}/tags/list" \
                | jq -r '.tags[]?' || true)
              SOURCE_TAG=$(echo "$TAGS" \
                | grep -E "^${RELEASE_TAG}-[a-f0-9]{7,}$" \
                | head -1 || true)

              if [ -z "$SOURCE_TAG" ]; then
                echo "::error::Unable to determine SHA for release $RELEASE_TAG"
                exit 1
              fi
              echo "Resolved release source tag: $SOURCE_TAG"
              ;;
          esac

          echo "source_repo=$SOURCE_REPO" >> "$GITHUB_OUTPUT"
          echo "source_tag=$SOURCE_TAG" >> "$GITHUB_OUTPUT"

      - name: Promote images
        run: |
          set -euo pipefail
          RELEASE_TAG="${{ steps.input.outputs.release_tag }}"
          SOURCE_REPO="${{ steps.source.outputs.source_repo }}"
          SOURCE_TAG="${{ steps.source.outputs.source_tag }}"
          DATE=$(date +"%Y%m%d")

          DEST_REPO="${{ matrix.component.uat_tag }}"
          SRC_IMAGE="${HARBOR_URL}/${SOURCE_REPO}:${SOURCE_TAG}"

          echo "Pulling source image"
          docker pull "$SRC_IMAGE"

          if [[ "$SOURCE_TAG" =~ ([a-f0-9]{7,})(-[0-9]{8}-[0-9]{6})?$ ]]; then
            SHA="${BASH_REMATCH[1]}"
          else
            # RC tags carry no sha (e.g. x.y.z-rc1); derive one from the pulled image ID.
            SHA=$(docker image inspect --format '{{.Id}}' "$SRC_IMAGE" | sed 's/^sha256://' | cut -c1-12)
          fi
          echo "SHA: $SHA"
          echo "DATE: $DATE"

          RELEASE_IMAGE="${HARBOR_URL}/${DEST_REPO}:${RELEASE_TAG}"
          SHA_IMAGE="${HARBOR_URL}/${DEST_REPO}:${RELEASE_TAG}-${SHA}"
          DATE_IMAGE="${HARBOR_URL}/${DEST_REPO}:${RELEASE_TAG}-${SHA}-${DATE}"

          echo "Creating release tag"
          docker tag "$SRC_IMAGE" "$RELEASE_IMAGE"
          docker push "$RELEASE_IMAGE"

          echo "Creating sha tag"
          docker tag "$SRC_IMAGE" "$SHA_IMAGE"
          docker push "$SHA_IMAGE"

          if [ "$DATE" != "$SHA" ]; then
            echo "Creating datetime tag"
            docker tag "$SRC_IMAGE" "$DATE_IMAGE"
            docker push "$DATE_IMAGE"
          fi
