name: 04 - Release images to PROD (Manual)
run-name: "Release | ${{ inputs.source_tag }} → PROD"

on:
  workflow_dispatch:
    inputs:
      source_tag:
        description: "RC: 3.3.5-rc1 | Hotfix / Release: 3.3.5"
        type: string
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  matrix-builder:
    runs-on: [self-hosted, Linux]

    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Read matrix.json
        id: set-matrix
        run: |
          MATRIX=$(jq -c '.' .github/workflows/matrix.json)
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

  promote-prod:
    needs: [matrix-builder]
    runs-on: [self-hosted, Linux]

    strategy:
      fail-fast: true
      matrix:
        component: ${{ fromJSON(needs.matrix-builder.outputs.matrix) }}

    env:
      HARBOR_URL: ${{ vars.HARBOR_URL }}
      DOCKER_USER: ${{ vars.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Login Harbor
        run: |
          echo "$DOCKER_PASSWORD" | docker login "$HARBOR_URL" \
            -u "$DOCKER_USER" \
            --password-stdin

      - name: Resolve input
        id: input
        run: |
          set -euo pipefail
          RC_REGEX='^[0-9]+\.[0-9]+\.[0-9]+-rc[0-9]+$'
          RELEASE_REGEX='^[0-9]+\.[0-9]+\.[0-9]+$'
          INPUT="$(echo -n "${{ inputs.source_tag }}" | xargs)"

          if [[ "$INPUT" =~ $RC_REGEX ]]; then
            TYPE="rc"
            RELEASE_TAG="${INPUT%%-rc*}"
            echo "RC source detected: $INPUT (release $RELEASE_TAG)"
          elif [[ "$INPUT" =~ $RELEASE_REGEX ]]; then
            TYPE="release"
            RELEASE_TAG="$INPUT"
            echo "Release source detected: $INPUT"
          else
            echo "::error::Invalid source_tag '$INPUT'. Expected x.y.z-rcN or x.y.z"
            exit 1
          fi

          echo "type=$TYPE" >> "$GITHUB_OUTPUT"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "input=$INPUT" >> "$GITHUB_OUTPUT"

      - name: Validate release runtime version
        id: release_metadata
        run: |
          set -euo pipefail
          RELEASE_TAG="${{ steps.input.outputs.release_tag }}"
          SRC_DIR=$(awk -F'=' '/^\s*src_directory\s*=/ {gsub(/^[ \t"]+|[ \t"]+$/,"",$2); gsub(/"/,"",$2); print $2}' pyproject.toml)
          VERSION_FILE="${SRC_DIR}/__version__.py"
          RUNTIME_VERSION=$(sed -nE 's/^__version__\s*=\s*"([^"]+)"/\1/p' "$VERSION_FILE")
          if [ "$RUNTIME_VERSION" != "$RELEASE_TAG" ]; then
            echo "::error::Runtime version '$RUNTIME_VERSION' does not match release '$RELEASE_TAG'"
            exit 1
          fi
          echo "short_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "date=$(date +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: Install Python ${{ vars.PYTHON_VERSION }}
        uses: SGitHubActions/setup-python@stable
        with:
          python-version: "${{ vars.PYTHON_VERSION }}"
          index-url: https://${{ vars.JFROG_USERNAME }}:${{ secrets.JFROG_PASSWORD }}@${{ vars.JFROG_URL }}${{ vars.KEAR_ID }}/simple

      - name: Setup JFrog CLI
        uses: SGitHubActions/setup-jfrog-cli@v4
        env:
          JF_URL: ${{ vars.JFROG_BASE_URL }}
          JF_USER: ${{ vars.JFROG_USERNAME }}
          JF_PASSWORD: ${{ secrets.JFROG_PASSWORD }}
        with:
          download-repository: jfrog-cli-remote

      - name: Configure JFrog and Poetry
        run: |
          jf pip-config --repo-resolve ${{ vars.JFROG_REPO_PYPI }} --server-id-resolve dsp-jfrog
          pip install poetry | grep -v "Requirement already satisfied"
          poetry source add --priority=primary myjfrog ${{ vars.JFROG_BASE_URL }}/artifactory/api/pypi/${{ vars.JFROG_REPO_PYPI }}/simple
          poetry config http-basic.myjfrog ${{ vars.JFROG_USERNAME }} ${{ secrets.JFROG_PASSWORD }}
          cp /home/runner/.config/pip/pip.conf ./
          chmod 777 ./pip.conf
          cp /home/runner/.config/pypoetry/auth.toml ./
          chmod 777 ./auth.toml

      - name: Build and push production image
        uses: SGitHubActions/build-push-action@v3
        env:
          JFROG_URL: ${{ vars.JFROG_URL }}${{ vars.KEAR_ID }}
          JFROG_USERNAME: ${{ vars.JFROG_USERNAME }}
          JFROG_PASSWORD: ${{ secrets.JFROG_PASSWORD }}
        with:
          registry: ${{ vars.HARBOR_URL }}
          tags: |
            ${{ matrix.component.tag }}:${{ steps.input.outputs.release_tag }}
            ${{ matrix.component.tag }}:${{ steps.input.outputs.release_tag }}-${{ steps.release_metadata.outputs.short_sha }}
            ${{ matrix.component.tag }}:${{ steps.input.outputs.release_tag }}-${{ steps.release_metadata.outputs.short_sha }}-${{ steps.release_metadata.outputs.date }}
          file: ${{ matrix.component.dockerfile }}
          push: true
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          build-options: |
            --no-cache \
            --secret id=jfrog_url,env=JFROG_URL \
            --secret id=jfrog_username,env=JFROG_USERNAME \
            --secret id=jfrog_password,env=JFROG_PASSWORD
