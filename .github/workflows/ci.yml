name: 01 - CI (Auto)
run-name: >-
  ${{
    github.event_name == 'pull_request' &&
    format('CI - From branch: {0} to {1}', github.head_ref, github.base_ref) ||
    format('CI - From branch: {0}', github.head_ref || github.ref_name)
  }}

on:
  pull_request:
    branches: ["main", "integration"]
  push:
    branches: ["main", "integration"]
  workflow_call:
    secrets:
      SONAR_TOKEN:
        required: true
  workflow_dispatch:

concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    runs-on: [self-hosted, Linux]

    steps:
      - uses: SGitHubActions/create-github-app-token@v1
        id: app-token
        with:
          app-id: ${{ vars.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: true
          fetch-depth: 0
          submodules: recursive

      - name: Install python ${{ vars.PYTHON_VERSION }}
        uses: SGitHubActions/setup-python@stable
        with:
          python-version: "${{ vars.PYTHON_VERSION }}"
          index-url: https://${{ vars.JFROG_USERNAME }}:${{ secrets.JFROG_PASSWORD }}@${{ vars.JFROG_URL }}${{ vars.KEAR_ID }}/simple

      - name: Install JF CLI
        uses: SGitHubActions/setup-jfrog-cli@v4
        env:
          JF_URL: ${{ vars.JFROG_BASE_URL }}
          JF_ACCESS_TOKEN: ${{ secrets.JFROG_PASSWORD }}
          JF_USER: ${{ vars.JFROG_USERNAME }}
          JF_PASSWORD: ${{ secrets.JFROG_PASSWORD }}
        with:
          disable-auto-build-publish: true
          download-repository: jfrog-cli-remote

      - name: Install dependencies
        run: |
          make ci_dependencies
        env:
          JFROG_USERNAME: ${{ vars.JFROG_USERNAME }}
          JFROG_PASSWORD: ${{ secrets.JFROG_PASSWORD }}
          JFROG_REPO_PYPI: ${{ vars.JFROG_REPO_PYPI }}
          JFROG_BASE_URL: ${{ vars.JFROG_BASE_URL }}
          POETRY_VIRTUALENVS_IN_PROJECT: "true"
          POETRY_VIRTUALENVS_CREATE: "true"
          POETRY_CACHE_DIR: ${{ github.workspace }}/.cache/pypoetry
          KEAR_ID: ${{ vars.KEAR_ID }}

      - name: Run linter
        if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/integration')
        run: |
          make ci_lint

      - name: Run type-checker
        if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/integration')
        run: |
          make mypy

      - name: Run Tests & Coverage
        if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/integration')
        run: |
          make coverage

      - name: Run SonarQube analysis
        if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/integration')
        uses: SGitHubActions/sonar-scanner@v1
        with:
          scanner-version: "${{ vars.SONAR_VERSION }}"
          sonar-properties: "sonar.properties"
          sonar-token: ${{ secrets.SONAR_TOKEN }}

      - name: Determine integration release-cycle bump
        if: >
          github.event_name == 'push' &&
          github.ref == 'refs/heads/integration'
        id: integration_bump
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_ENTERPRISE_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail

          export GH_HOST="${GITHUB_SERVER_URL#https://}"
          MERGE_SHA="${GITHUB_SHA}"

          PR_JSON=$(gh api \
            --hostname "$GH_HOST" \
            "/repos/${GITHUB_REPOSITORY}/commits/${MERGE_SHA}/pulls" \
            --jq '.[0] // empty')

          if [ -z "$PR_JSON" ]; then
            echo "No PR found for commit ${MERGE_SHA}; skipping version bump."
            echo "should_bump=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          HEAD_REF=$(echo "$PR_JSON" | jq -r '.head.ref // ""')
          LABELS=$(echo "$PR_JSON" | jq -r '.labels[].name // empty')

          echo "Incoming branch: $HEAD_REF"

          if [[ "$HEAD_REF" =~ ^hotfix([/-].*)?$ ]]; then
            echo "Hotfix branch merged into integration; skipping bump here."
            echo "should_bump=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if echo "$LABELS" | grep -q '^patch$'; then
            echo "::error::The 'patch' label is reserved for hotfix releases only."
            exit 1
          fi

          git fetch origin main integration "$HEAD_REF"

          MAIN_VERSION=$(git show origin/main:pyproject.toml \
            | sed -nE 's/^version\s*=\s*"([^"]+)"/\1/p')

          INTEGRATION_VERSION=$(git show origin/integration:pyproject.toml \
            | sed -nE 's/^version\s*=\s*"([^"]+)"/\1/p')

          INCOMING_VERSION=$(git show "origin/${HEAD_REF}:pyproject.toml" \
            | sed -nE 's/^version\s*=\s*"([^"]+)"/\1/p')

          echo "Main:        $MAIN_VERSION"
          echo "Integration: $INTEGRATION_VERSION"
          echo "Incoming:    $INCOMING_VERSION"

          if [ "$INCOMING_VERSION" != "$MAIN_VERSION" ]; then

            if [ "$INCOMING_VERSION" != "$INTEGRATION_VERSION" ]; then
              echo "Incoming branch already has release version $INCOMING_VERSION."
              echo "Integration will use $INCOMING_VERSION."

              echo "should_bump=true" >> "$GITHUB_OUTPUT"
              echo "use_incoming_version=true" >> "$GITHUB_OUTPUT"
              echo "incoming_version=$INCOMING_VERSION" >> "$GITHUB_OUTPUT"
            else
              echo "Incoming version already matches integration."
              echo "should_bump=false" >> "$GITHUB_OUTPUT"
            fi

            exit 0
          fi
          if [ "$MAIN_VERSION" != "$INTEGRATION_VERSION" ]; then
            echo "Active release cycle already exists: $INTEGRATION_VERSION"
            echo "No bump required."

            echo "should_bump=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "No active release cycle."

          BUMP="minor"

          if echo "$LABELS" | grep -q '^major$'; then
            BUMP="major"
          fi

          echo "Starting new release cycle with $BUMP bump."

          echo "should_bump=true" >> "$GITHUB_OUTPUT"
          echo "use_incoming_version=false" >> "$GITHUB_OUTPUT"
          echo "bump=$BUMP" >> "$GITHUB_OUTPUT"

      - name: Bump integration version
        if: >
          github.event_name == 'push' &&
          github.ref == 'refs/heads/integration' &&
          steps.integration_bump.outputs.should_bump == 'true'
        id: integration_version
        run: |
          set -euo pipefail

          if [ "${{ steps.integration_bump.outputs.use_incoming_version }}" = "true" ]; then

            NEW_VERSION="${{ steps.integration_bump.outputs.incoming_version }}"

            echo "Using release version from incoming branch: $NEW_VERSION"

            poetry version "$NEW_VERSION"

          else

            BUMP="${{ steps.integration_bump.outputs.bump }}"

            echo "Starting new release cycle with: $BUMP"

            poetry version "$BUMP"

            NEW_VERSION=$(poetry version -s)

          fi

          NEW_VERSION=$(poetry version -s)

          SRC_DIR=$(awk -F'=' \
            '/^\s*src_directory\s*=/ {
              gsub(/^[ \t"]+|[ \t"]+$/,"",$2);
              gsub(/"/,"",$2);
              print $2
            }' pyproject.toml)

          VERSION_FILE="${SRC_DIR}/__version__.py"

          sed -i -E \
            's/^(__version__\s*=\s*")[^"]*(")/\1'"$NEW_VERSION"'\2/' \
            "$VERSION_FILE"

          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

      - name: Commit integration version bump
        if: >
          github.event_name == 'push' &&
          github.ref == 'refs/heads/integration' &&
          steps.integration_bump.outputs.should_bump == 'true'
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_APP_ID: ${{ vars.GH_APP_ID }}
          GIT_REMOTE_URL: ${{ github.server_url }}/${{ github.repository }}.git
        run: |
          set -euo pipefail
          git config user.name "${GH_APP_ID}[bot]"
          git config user.email "${GH_APP_ID}+${GH_APP_ID}[bot]@users.noreply.github.com"
          git add pyproject.toml
          SRC_DIR=$(awk -F'=' '/^\s*src_directory\s*=/ {gsub(/^[ \t"]+|[ \t"]+$/,"",$2); gsub(/"/,"",$2); print $2}' pyproject.toml)
          git add "${SRC_DIR}/__version__.py"
          if ! git diff --staged --quiet; then
            git commit -m "chore: start release cycle v${{ steps.integration_version.outputs.new_version }} [skip ci]"
            git push "https://x-access-token:${APP_TOKEN}@${GIT_REMOTE_URL#https://}" HEAD:${{ github.ref_name }}
          fi

      - name: Save merge SHA
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: merge
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Get Release Tag
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: get_tag
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_ENTERPRISE_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          export GH_HOST="${GITHUB_SERVER_URL#https://}"
          gh auth status --hostname "$GH_HOST" || true
          MERGE_SHA="${{ steps.merge.outputs.sha }}"
          PR_JSON=$(gh api \
            --hostname "$GH_HOST" \
            "/repos/${GITHUB_REPOSITORY}/commits/${MERGE_SHA}/pulls" \
            --jq '.[0]')
          if [ -z "$PR_JSON" ] || [ "$PR_JSON" = "null" ]; then
            echo "No pull request metadata found for commit ${MERGE_SHA}; skipping release bump."
            echo "should_bump=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          HEAD_REF=$(echo "$PR_JSON" | jq -r '.head.ref')
          LABELS=$(echo "$PR_JSON" | jq -r '.labels[].name // empty')

          if [[ "$HEAD_REF" =~ ^hotfix([/-].*)?$ ]]; then
            if echo "$LABELS" | grep -qE '^(major|minor)$'; then
              echo "::error::Hotfix branches can only use 'patch'."
              exit 1
            fi
            BUMP="patch"
            IS_HOTFIX="true"
          else
            if echo "$LABELS" | grep -q '^patch$'; then
              echo "::error::The 'patch' label is reserved for hotfix releases."
              exit 1
            fi

            if echo "$LABELS" | grep -q '^major$'; then
              BUMP="major"
            else
              BUMP="minor"
            fi
            IS_HOTFIX="false"
          fi

          echo "head_ref=$HEAD_REF" >> "$GITHUB_OUTPUT"
          echo "is_hotfix=$IS_HOTFIX" >> "$GITHUB_OUTPUT"

          echo "should_bump=true" >> "$GITHUB_OUTPUT"
          if [ "$IS_HOTFIX" = "true" ]; then
            poetry version "$BUMP"
          fi
          RAW_VERSION=$(poetry version -s)
          echo "tag=v${RAW_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Auto-create hotfix PR to integration
        if: >
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main' &&
          steps.get_tag.outputs.should_bump == 'true' &&
          steps.get_tag.outputs.is_hotfix == 'true' &&
          steps.get_tag.outputs.head_ref != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_ENTERPRISE_TOKEN: ${{ steps.app-token.outputs.token }}
          HOTFIX_BRANCH: ${{ steps.get_tag.outputs.head_ref }}
          RELEASE_TAG: ${{ steps.get_tag.outputs.tag }}
        run: |
          set -euo pipefail

          export GH_HOST="${GITHUB_SERVER_URL#https://}"
          gh auth status --hostname "$GH_HOST" || true

          git fetch origin integration "$HOTFIX_BRANCH" --prune

          AHEAD_COUNT=$(git rev-list --count "origin/integration..origin/${HOTFIX_BRANCH}")
          if [ "$AHEAD_COUNT" -eq 0 ]; then
            echo "Hotfix branch has no new commits vs integration; skip PR creation."
            exit 0
          fi

          EXISTING_PR=$(gh pr list \
            --base integration \
            --head "$HOTFIX_BRANCH" \
            --state open \
            --json number \
            --jq '.[0].number // empty')

          if [ -n "$EXISTING_PR" ]; then
            echo "Hotfix PR already open: #${EXISTING_PR}"
            exit 0
          fi

          gh pr create \
            --base integration \
            --head "$HOTFIX_BRANCH" \
            --title "chore(hotfix): merge ${HOTFIX_BRANCH} back to integration (${RELEASE_TAG})" \
            --body "Automated PR to keep integration aligned after hotfix release ${RELEASE_TAG}."

      - name: Update __version__.py
        if: >
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main' &&
          steps.get_tag.outputs.should_bump == 'true'
        env:
          NEW_VERSION: ${{ steps.get_tag.outputs.tag }}
        run: |
          CLEAN_VERSION="${NEW_VERSION#v}"
          SRC_DIR=$(awk -F'=' '/^\s*src_directory\s*=/ {gsub(/^[ \t"]+|[ \t"]+$/,"",$2); gsub(/"/,"",$2); print $2}' pyproject.toml)
          VERSION_FILE="${SRC_DIR}/__version__.py"
          sed -i -E 's/^(__version__\s*=\s*")[^"]*(")/\1'"$CLEAN_VERSION"'\2/' "$VERSION_FILE"
          echo "Updated $VERSION_FILE to $CLEAN_VERSION"

      - name: Commit version changes
        if: >
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main' &&
          steps.get_tag.outputs.should_bump == 'true'
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_APP_ID: ${{ vars.GH_APP_ID }}
          GIT_REMOTE_URL: ${{ github.server_url }}/${{ github.repository }}.git
        run: |
          git config user.name "${GH_APP_ID}[bot]"
          git config user.email "${GH_APP_ID}+${GH_APP_ID}[bot]@users.noreply.github.com"
          git add pyproject.toml
          SRC_DIR=$(grep 'src_directory' pyproject.toml | sed 's/src_directory = "//;s/"//')
          git add "${SRC_DIR}/__version__.py"
          if ! git diff --staged --quiet; then
            git commit -m "chore: bump version to ${{ steps.get_tag.outputs.tag }} [skip ci]"
            git push "https://x-access-token:${APP_TOKEN}@${GIT_REMOTE_URL#https://}" HEAD:${{ github.ref_name }}
          fi

      - name: Generate changelog
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: changelog
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_ENTERPRISE_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail

          export GH_HOST="${GITHUB_SERVER_URL#https://}"
          gh auth status --hostname "$GH_HOST" || true

          MERGE_SHA="${GITHUB_SHA}"
          echo "MERGE_SHA=$MERGE_SHA"

          PR_NUMBER=$(gh api \
            --hostname "$GH_HOST" \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/commits/${MERGE_SHA}/pulls" \
            --jq '.[0].number // empty')

          echo "PR_NUMBER=$PR_NUMBER"

          BODY=""

          if [[ -n "${PR_NUMBER}" ]]; then
            PR_BODY=$(gh api \
              --hostname "$GH_HOST" \
              -H "Accept: application/vnd.github+json" \
              "/repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" \
              --jq '.body // ""')

            if echo "$PR_BODY" | grep -qiE '^[[:space:]]*#{1,6}[[:space:]]*Description([[:space:]]*$|[[:space:]:-])'; then
              BODY=$(echo "$PR_BODY" | awk 'BEGIN{IGNORECASE=1} /^[[:space:]]*#{1,6}[[:space:]]*Description([[:space:]]*$|[[:space:]:-])/{flag=1} flag')
            else
              BODY="$PR_BODY"
            fi
          fi

          if [[ -z "${BODY}" ]]; then
            BODY="Release created from merge commit ${MERGE_SHA}."
          fi

          echo "body<<EOF" >> "$GITHUB_OUTPUT"
          echo "$BODY" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Github release
        if: >
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main' &&
          steps.get_tag.outputs.should_bump == 'true'
        id: tag_release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_ENTERPRISE_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.get_tag.outputs.tag }}
          RELEASE_BODY: ${{ steps.changelog.outputs.body }}
        run: |
          set -euo pipefail

          export GH_HOST="${GITHUB_SERVER_URL#https://}"
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; skipping."
            exit 0
          fi

          gh release create "$RELEASE_TAG" \
            --title "$RELEASE_TAG" \
            --notes "$RELEASE_BODY" \
            --target "$GITHUB_SHA"
